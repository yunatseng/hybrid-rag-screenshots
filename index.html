<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>實際專案截圖</title>
  <meta name="description" content="Hybrid RAG 實際專案截圖：搜尋與檢索結果、分析圖表與 AI 結論。">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; color: #202124; background: #f5f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1600px, 100%); margin-inline: auto; padding: 56px 32px 64px; }
    header { margin-bottom: 36px; }
    h1 { margin: 0; padding-left: 18px; border-left: 6px solid #ff6b0b; font-size: clamp(1.85rem, 4vw, 2.75rem); line-height: 1.3; letter-spacing: .03em; }
    header p { margin: 16px 0 0 24px; color: #5a606b; font-size: 1rem; line-height: 1.7; }
    figure { margin: 0 0 36px; }
    figcaption { margin-bottom: 12px; }
    h2 { margin: 0; font-size: 1.25rem; line-height: 1.5; }
    figure a { display: block; border-radius: 10px; overflow: hidden; background: white; box-shadow: 0 3px 18px #16203212; }
    figure a:focus-visible { outline: 3px solid #b64500; outline-offset: 5px; }
    img { display: block; width: 100%; height: auto; }
    footer { color: #5a606b; font-size: .9rem; line-height: 1.7; }
    @media (max-width: 600px) {
      main { padding: 32px 16px 40px; }
      header { margin-bottom: 28px; }
      header p { margin-left: 0; }
      figure { margin-bottom: 28px; }
      h2 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>實際專案截圖</h1>
      <p>Hybrid RAG · 搜尋檢索與分析結果</p>
    </header>
    <figure>
      <figcaption><h2>搜尋與檢索結果</h2></figcaption>
      <a href="./Hybrid_RAG_1.png" target="_blank" rel="noopener" aria-label="開啟搜尋與檢索結果原始圖片（另開分頁）">
        <img src="./Hybrid_RAG_1.png" alt="Hybrid RAG 文件搜尋介面，包含 BM25、Dense 與 Hybrid RRF 搜尋演算法比較，以及相關評議文件的詳細檢索結果。" width="1672" height="941" fetchpriority="high">
      </a>
    </figure>
    <figure>
      <figcaption><h2>分析圖表與 AI 結論</h2></figcaption>
      <a href="./Hybrid_RAG_2.png" target="_blank" rel="noopener" aria-label="開啟分析圖表與 AI 結論原始圖片（另開分頁）">
        <img src="./Hybrid_RAG_2.png" alt="案件數量、評議結果比例與金額趨勢圖表，以及保險公司評議風險分析與 AI 結論。" width="1672" height="941" loading="lazy" decoding="async">
      </a>
    </figure>
    <footer>點選圖片可另開分頁查看原圖。</footer>
  </main>
</body>
</html>
